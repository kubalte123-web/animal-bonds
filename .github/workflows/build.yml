name: Build & test

on:
  push:
    branches-ignore: [ci-results]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare results folder
        run: mkdir -p results/shots && echo "commit ${GITHUB_SHA}" > results/status.txt

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --console=plain 2>&1 | tee results/build.log
          cp build/libs/*.jar results/ || true

      - name: Dump API signatures (for development)
        if: always()
        continue-on-error: true
        run: |
          JAR=$(find build ~/.gradle -name "*.jar" 2>/dev/null | grep -iE "neoforge-.*(merged|client|minecraft).*\.jar$|minecraft-.*\.jar$" | head -5)
          GECKO=$(find ~/.gradle -name "geckolib-neoforge-*.jar" 2>/dev/null | grep -v sources | head -1)
          NEO=$(find ~/.gradle build -name "neoforge-*-universal.jar" -o -name "neoforge-*.jar" 2>/dev/null | grep -v sources | head -2)
          JAR=$(printf "%s\n%s\n%s" "$JAR" "$GECKO" "$NEO")
          [ -n "$GECKO" ] && unzip -Z1 "$GECKO" | grep '\.class$' | grep -v '\$' > results/geckolib-classes.txt || true
          echo "$JAR" > results/api.txt
          J=$(echo "$JAR" | tr '\n' ':')
          for c in $(cat .github/api-classes.txt 2>/dev/null); do
            echo "=== $c" >> results/api.txt
            javap -cp "$J" -p "$c" >> results/api.txt 2>&1 || true
          done
          for jar in $JAR; do
            for f in $(unzip -Z1 "$jar" 2>/dev/null | grep -E "$(cat .github/data-files.txt 2>/dev/null | paste -sd'|')"); do
              echo "=== $f ($jar)" >> results/data.txt
              unzip -p "$jar" "$f" >> results/data.txt 2>/dev/null || true
              echo >> results/data.txt
            done
          done

      - name: Server self-test
        id: selftest
        continue-on-error: true
        if: steps.build.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\ngenerate-structures=false\nspawn-monsters=false\npause-when-empty-seconds=-1\n' > run/server.properties
          ./gradlew runSelfTest --console=plain 2>&1 | tee results/selftest-full.log || true
          grep -E "ABTEST|ELTEST|GTEST|PTEST|Exception|ERROR" results/selftest-full.log > results/selftest.log || true
          grep -q "ABTEST RESULT: PASS" results/selftest-full.log && grep -q "ELTEST RESULT: PASS" results/selftest-full.log && grep -q "GTEST RESULT: PASS" results/selftest-full.log && grep -q "PTEST RESULT: PASS" results/selftest-full.log

      - name: Client visual test
        id: clienttest
        continue-on-error: true
        if: steps.build.outcome == 'success'
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick mesa-utils libgl1-mesa-dri libegl1 libgles2 > /dev/null
          # Use the world generated by the server test as the single player save.
          mkdir -p run/saves
          if [ -d run/world ]; then cp -r run/world run/saves/world; fi
          printf 'onboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nguiScale:2\nnarrator:0\nsoundCategory_master:0.0\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:6\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          ./gradlew runClientTest --console=plain > results/client-full.log 2>&1 &
          GPID=$!
          seen=""
          for i in $(seq 1 1200); do
            sleep 1
            for name in $(grep -oE "ABCLIENT SHOT [a-z0-9]+" results/client-full.log | awk '{print $3}'); do
              case " $seen " in *" $name "*) ;; *)
                sleep 1
                import -window root "results/shots/$name.png" && echo "shot $name"
                seen="$seen $name";;
              esac
            done
            if grep -q "ABCLIENT DONE" results/client-full.log; then break; fi
            if ! kill -0 $GPID 2>/dev/null; then echo "client exited"; break; fi
          done
          # Always grab the final screen for debugging.
          import -window root results/shots/zz_last.png || true
          kill $GPID 2>/dev/null || true
          pkill -f java || true
          grep -E "ABCLIENT|RIDETEST|Exception|ERROR|FATAL|animalbonds" results/client-full.log | head -400 > results/client.log || true
          grep -q "ABCLIENT DONE" results/client-full.log && ! grep -q "RIDETEST .* FAIL" results/client-full.log

      - name: Elementals visual test (GeckoLib and built-in renderer)
        id: eltest
        continue-on-error: true
        if: steps.build.outcome == 'success'
        timeout-minutes: 20
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          pgrep Xvfb > /dev/null || (Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &)
          export DISPLAY=:99
          sleep 2
          ok=1
          for task in pClient elClientGecko elClientPlain gClient; do
            log="results/$task-full.log"
            ./gradlew run${task^} --console=plain > "$log" 2>&1 &
            GPID=$!
            seen=""
            for i in $(seq 1 600); do
              sleep 1
              for name in $(grep -oE "(ELCLIENT|GCLIENT|PCLIENT) SHOT [a-z0-9]+" "$log" | awk '{print $3}'); do
                case " $seen " in *" $name "*) ;; *)
                  sleep 1
                  import -window root "results/shots/el_$name.png" && echo "shot $name"
                  seen="$seen $name";;
                esac
              done
              if grep -qE "(ELCLIENT|GCLIENT|PCLIENT) DONE" "$log"; then break; fi
              if ! kill -0 $GPID 2>/dev/null; then echo "client exited"; break; fi
            done
            import -window root "results/shots/zz_$task.png" || true
            sleep 5
            kill $GPID 2>/dev/null || true
            pkill -f java || true
            sleep 3
            grep -E "ELCLIENT|GCLIENT|PCLIENT|Żywiołaki|elementals|gospodarstwo|golebie|Exception|ERROR|FATAL" "$log" | head -300 > "results/$task.log" || true
            grep -qE "(ELCLIENT|GCLIENT|PCLIENT) DONE" "$log" || ok=0
          done
          [ $ok = 1 ]

      - name: Summary
        if: always()
        run: |
          {
            echo "build=${{ steps.build.outcome }}"
            echo "selftest=${{ steps.selftest.outcome }}"
            echo "clienttest=${{ steps.clienttest.outcome }}"
            echo "eltest=${{ steps.eltest.outcome }}"
          } >> results/status.txt
          cat results/status.txt
          # keep logs small enough for git
          for f in results/*-full.log; do [ -f "$f" ] && tail -c 3000000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animalbonds-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Publish results to ci-results branch
        if: always()
        run: |
          cd results
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results

      - name: Fail if any test failed
        if: steps.build.outcome != 'success' || steps.selftest.outcome != 'success' || steps.clienttest.outcome != 'success' || steps.eltest.outcome != 'success'
        run: exit 1
